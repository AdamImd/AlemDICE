  top_k: 64
  model_seed: 42
  num_ctx: 12288
primary_contrasts:
  response_mode: free_concise - free_thinking
  cohesion: cohesion_concise - free_concise
primary_outcomes:
  - valid_episode_rate
  - action_parse_rate
  - Team/total_achievements
  - episode_return
  - Coordination/total_successes
cost_outcomes:
  - output_tokens_per_model_call
  - input_tokens_per_model_call
  - episode_wall_seconds_per_step
  - delivered_communication_bytes_per_step
decision_rules:
  concise: >-
    Indeterminate unless all three seed pairs are valid. Positive only if concise
    completes at least as many episodes, has non-lower action parsing in at least
    two of three paired seeds, lowers output tokens per model call in at least two
    of three, and reduces total achievements in no more than one seed. Wall time is
    exploratory because arms execute sequentially on shared services.
  cohesion: >-
    Indeterminate unless all three seed pairs are valid. Positive efficacy signal
    only if total achievements improve in at least two of three paired seeds and
    action parsing is lower in no more than one seed. Environment coordination
    successes are a secondary mechanism outcome, not a substitute for achievements.
    Report normalized token, communication, and wall-time overhead regardless.
limitations: >-
  Three seeds remain underpowered. No p-value or confidence interval from this study
  alone is treated as confirmatory evidence. Each episode runs to natural termination
  or a 200-step cap; 200 steps are not guaranteed. The response-mode contrast changes
  reasoning, visible chain-of-thought, and remembered chain-of-thought together, and
  the cohesion contrast evaluates the complete scaffold.
