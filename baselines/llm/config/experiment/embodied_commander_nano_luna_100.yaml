# @package _global_

experiment:
  profile: embodied_commander_nano_luna_100
  requires_api_key: true
  difficulties: [easy]
  seeds: [12100]

EVAL_SEED: 12100

agent:
  type: robust_all
  prompt_mode: specific_collaborative
  use_cot: true
  remember_cot: true
  use_scratchpad: true
  use_communication: true
  max_parse_retries: 0

team:
  topology: baseline
  id: squad-0
  members: [0, 1, 2]
  commander_agent_id: 0
  commander_review_interval: 5
  commander_lease_steps: 10
  commander_max_scratchpad_length: 1000
  commander_planner_client:
    client_name: openai_responses
    model_id: gpt-5.6-luna
    base_url: null
    generate_kwargs:
      temperature: 1.0
      max_tokens: 8192
      reasoning_effort: high
      store: false
      prompt_cache_key: alem:g56l:sq2:100:plan
      prompt_cache_traffic_shards: 1
      prompt_cache_options: {mode: explicit, ttl: 30m}
    timeout: 420
    max_retries: 5
    delay: 2
    alternate_roles: false

clients:
  - &nano_worker
    client_name: openai_responses
    model_id: gpt-5.4-nano
    base_url: null
    generate_kwargs:
      temperature: 1.0
      max_tokens: 8192
      reasoning_effort: none
      store: false
      prompt_cache_key: alem:g54n:sq2:100:w
      prompt_cache_traffic_shards: 3
    timeout: 420
    max_retries: 5
    delay: 2
    alternate_roles: false
  - <<: *nano_worker
    generate_kwargs:
      temperature: 1.0
      max_tokens: 8192
      reasoning_effort: none
      store: false
      prompt_cache_key: alem:g54n:sq2:100:f
      prompt_cache_traffic_shards: 3
  - <<: *nano_worker
    generate_kwargs:
      temperature: 1.0
      max_tokens: 8192
      reasoning_effort: none
      store: false
      prompt_cache_key: alem:g54n:sq2:100:m
      prompt_cache_traffic_shards: 3

eval:
  output_dir: outputs/alem_eval
  num_episodes:
    alem: 1
  num_workers: 1
  max_steps_per_episode: 100
  save_images: true
  save_images_every_episode: true
  debug: true
  generate_debriefs: false

alem:
  num_agents: 3
  max_timesteps: 10000
  coordination_difficulty: easy

WANDB_MODE: disabled
wandb:
  tags: [llm-eval, embodied-commander, nano-luna, exploratory-100]
