name: CI

on:
  push:
    branches: [main, aaai-submission]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check NTFS-compatible repository paths
        run: python scripts/check_ntfs_paths.py

      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.4.0"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ALEM (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import smoke test
        run: python -c "import alem; print('alem', alem.__version__)"

      - name: Minimal environment contract tests
        run: python -m pytest alem/tests/ -q

  # Separate from `test` because these need the baselines-llm extra (omegaconf,
  # wandb, provider SDKs) that the core suite deliberately does without.
  baselines-llm:
    needs: lint
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ALEM with LLM baselines
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,baselines-llm]"

      - name: Minimal LLM and recruitment contract tests
        run: python -m pytest baselines/llm/ -q

  windows:
    runs-on: windows-latest
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked CPU and LLM dependencies
        run: uv sync --frozen --extra baselines-llm

      - name: Check paths and imports
        run: |
          uv run --frozen python scripts/check_ntfs_paths.py
          uv run --frozen python -c "import alem, openai; print('alem', alem.__version__)"
